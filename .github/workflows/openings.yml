name: openings
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: openings
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Stockfish and chess library
        run: |
          pip install chess
          sudo mkdir -p /usr/games
          python3 - <<'PY' > url.txt
          import json, urllib.request
          rels = json.load(urllib.request.urlopen("https://api.github.com/repos/official-stockfish/Stockfish/releases?per_page=15"))
          for r in rels:
              for a in r["assets"]:
                  n = a["name"].lower()
                  if "avx2" in n and ("ubuntu" in n or "linux" in n) and "vnni" not in n and "avx512" not in n:
                      print(a["browser_download_url"]); raise SystemExit
          PY
          URL=$(cat url.txt)
          echo "URL=$URL"
          if [ -n "$URL" ]; then
            curl -fL --retry 3 -o sf.pkg "$URL"
            mkdir sfx
            tar xf sf.pkg -C sfx || unzip -q sf.pkg -d sfx
            BIN=$(find sfx -type f -name 'stockfish*' -perm /111 | head -1)
            sudo cp "$BIN" /usr/games/stockfish
          else
            echo "No ready binary found: building from source"
            git clone --depth 1 https://github.com/official-stockfish/Stockfish.git sfsrc
            cd sfsrc/src
            make -j4 net
            make -j4 build ARCH=x86-64-avx2
            sudo cp stockfish /usr/games/stockfish
            cd ../..
          fi
          sudo chmod +x /usr/games/stockfish
          echo "uci" | /usr/games/stockfish | head -2
      - run: python opening_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "opening-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bank.json state.json
          git commit -m "new positions" || exit 0
          git pull --rebase -q || true
          git push
