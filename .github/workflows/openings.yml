name: openings
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: openings
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Stockfish and chess library
        run: |
          pip install chess
          sudo mkdir -p /usr/games
          URL=$(curl -fsSL https://api.github.com/repos/official-stockfish/Stockfish/releases/latest | python3 -c "import json,sys; a=json.load(sys.stdin)['assets']; c=[x['browser_download_url'] for x in a if 'ubuntu' in x['name'] and 'x86-64-avx2' in x['name']]; print(c[0] if c else '')")
          echo "URL=$URL"
          if [ -n "$URL" ]; then
            curl -fL --retry 3 -o sf.pkg "$URL"
            mkdir sfx
            tar xf sf.pkg -C sfx || unzip -q sf.pkg -d sfx
            BIN=$(find sfx -type f -name 'stockfish*' -perm /111 | head -1)
            sudo cp "$BIN" /usr/games/stockfish
          else
            sudo apt-get update -y
            sudo apt-get install -y stockfish
          fi
          sudo chmod +x /usr/games/stockfish
          echo "uci" | /usr/games/stockfish | head -2
      - run: python opening_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "opening-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bank.json state.json
          git commit -m "new positions" || exit 0
          git pull --rebase -q || true
          git push
